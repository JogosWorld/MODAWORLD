```html
<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion Star 👗</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ffd6ec, #d9c2ff);
        color: #4b2142;
        text-align: center;
    }

    h1 {
        margin: 20px 0 5px;
        font-size: 38px;
    }

    .subtitulo {
        margin-bottom: 20px;
    }

    .jogo {
        max-width: 1000px;
        margin: auto;
        padding: 20px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 25px;
    }

    .personagem,
    .menu {
        background: rgba(255,255,255,0.85);
        border-radius: 25px;
        padding: 25px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .personagem {
        min-height: 550px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
    }

    .boneca {
        position: relative;
        width: 260px;
        height: 390px;
        margin: auto;
    }

    .cabeca {
        position: absolute;
        top: 20px;
        left: 85px;
        width: 90px;
        height: 100px;
        background: #f4b183;
        border-radius: 50%;
        z-index: 4;
    }

    .cabelo {
        position: absolute;
        top: 5px;
        left: 70px;
        width: 120px;
        height: 125px;
        background: #5a3825;
        border-radius: 50% 50% 45% 45%;
        z-index: 5;
    }

    .cara {
        position: absolute;
        top: 62px;
        left: 105px;
        z-index: 6;
        font-size: 28px;
    }

    .corpo {
        position: absolute;
        top: 120px;
        left: 75px;
        width: 110px;
        height: 150px;
        background: #e85aad;
        clip-path: polygon(20% 0, 80% 0, 100% 100%, 0 100%);
        z-index: 3;
    }

    .bracos {
        position: absolute;
        top: 130px;
        left: 45px;
        width: 170px;
        height: 30px;
        background: #f4b183;
        border-radius: 30px;
        z-index: 2;
    }

    .pernas {
        position: absolute;
        top: 260px;
        left: 95px;
        width: 70px;
        height: 100px;
        border-left: 22px solid #f4b183;
        border-right: 22px solid #f4b183;
        z-index: 1;
    }

    .sapatos {
        position: absolute;
        top: 350px;
        left: 82px;
        font-size: 45px;
        z-index: 7;
    }

    .categoria {
        margin-top: 15px;
        font-weight: bold;
        font-size: 20px;
    }

    .botoes {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-top: 10px;
    }

    button {
        border: none;
        padding: 12px 18px;
        border-radius: 15px;
        background: #f58ac4;
        color: white;
        font-size: 15px;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        transform: scale(1.08);
        background: #d94f9d;
    }

    .desafio {
        margin: 10px 0 20px;
        padding: 15px;
        background: #fff0fa;
        border-radius: 15px;
        font-size: 18px;
    }

    .pontuacao {
        margin-top: 20px;
        font-size: 25px;
        font-weight: bold;
    }

    .resultado {
        margin-top: 10px;
        font-size: 18px;
        min-height: 30px;
    }

    @media(max-width: 700px) {
        .jogo {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<h1>👗 Fashion Star ✨</h1>
<p class="subtitulo">Cria o look perfeito!</p>

<div class="jogo">

    <div class="personagem">

        <div class="boneca">

            <div class="cabelo" id="cabelo"></div>
            <div class="cabeca"></div>
            <div class="cara">👀</div>
            <div class="bracos"></div>
            <div class="corpo" id="roupa"></div>
            <div class="pernas"></div>
            <div class="sapatos" id="sapatos">👠</div>

        </div>

        <div class="pontuacao">
            ⭐ Pontuação: <span id="pontos">0</span>
        </div>

        <div class="resultado" id="resultado"></div>

    </div>


    <div class="menu">

        <div class="desafio">
            🎯 Desafio:<br>
            <strong id="desafio">Gala de Luxo</strong>
        </div>

        <div class="categoria">👗 Roupa</div>

        <div class="botoes">
            <button onclick="roupa('#e85aad')">💗 Rosa</button>
            <button onclick="roupa('#6c63ff')">💜 Roxo</button>
            <button onclick="roupa('#111827')">🖤 Preto</button>
            <button onclick="roupa('#38bdf8')">💙 Azul</button>
            <button onclick="roupa('#facc15')">💛 Amarelo</button>
        </div>


        <div class="categoria">💇 Cabelo</div>

        <div class="botoes">
            <button onclick="cabelo('#5a3825')">🤎 Castanho</button>
            <button onclick="cabelo('#111111')">🖤 Preto</button>
            <button onclick="cabelo('#f5c542')">💛 Loiro</button>
            <button onclick="cabelo('#d946ef')">💜 Rosa</button>
        </div>


        <div class="categoria">👠 Sapatos</div>

        <div class="botoes">
            <button onclick="sapatos('👠')">👠 Salto</button>
            <button onclick="sapatos('👟')">👟 Ténis</button>
            <button onclick="sapatos('🥾')">🥾 Botas</button>
            <button onclick="sapatos('🥿')">🥿 Sapatilhas</button>
        </div>


        <div class="categoria">✨ Acessórios</div>

        <div class="botoes">
            <button onclick="acessorio('👑')">👑 Coroa</button>
            <button onclick="acessorio('💎')">💎 Diamante</button>
            <button onclick="acessorio('👜')">👜 Mala</button>
            <button onclick="acessorio('🕶️')">🕶️ Óculos</button>
        </div>

        <br>

        <button onclick="avaliar()" style="font-size:18px;">
            ⭐ Avaliar Look
        </button>

        <button onclick="novoDesafio()">
            🔄 Novo Desafio
        </button>

    </div>

</div>


<script>

let pontos = 0;

let desafios = [
    "Gala de Luxo",
    "Dia na Praia",
    "Festa de Aniversário",
    "Estilo Escolar",
    "Passeio na Cidade",
    "Tapete Vermelho"
];

let desafioAtual = 0;

function roupa(cor) {
    document.getElementById("roupa").style.background = cor;
}

function cabelo(cor) {
    document.getElementById("cabelo").style.background = cor;
}

function sapatos(tipo) {
    document.getElementById("sapatos").innerText = tipo;
}

function acessorio(tipo) {
    document.getElementById("resultado").innerText =
        "✨ Acessório escolhido: " + tipo;
}

function avaliar() {

    let ganho = Math.floor(Math.random() * 31) + 70;

    pontos += ganho;

    document.getElementById("pontos").innerText = pontos;

    let mensagem;

    if (ganho >= 95) {
        mensagem = "👑 UAU! Look de estrela!";
    } else if (ganho >= 85) {
        mensagem = "💖 Muito elegante!";
    } else {
        mensagem = "✨ Gostei do look!";
    }

    document.getElementById("resultado").innerText =
        mensagem + " +" + ganho + " pontos!";
}

function novoDesafio() {

    desafioAtual++;

    if (desafioAtual >= desafios.length) {
        desafioAtual = 0;
    }

    document.getElementById("desafio").innerText =
        desafios[desafioAtual];

    document.getElementById("resultado").innerText =
        "🎯 Novo desafio: " + desafios[desafioAtual];
}

</script>

</body>
</html>
```
