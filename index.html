<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Fashion Star 💖</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    color:#351c35;
    min-height:100vh;
    background:
        radial-gradient(circle at 10% 10%,#fff 0 4%,transparent 20%),
        radial-gradient(circle at 90% 20%,#fff 0 3%,transparent 18%),
        linear-gradient(135deg,#ffd5ea,#ead7ff,#d3f2ff);
}

/* ---------- HEADER ---------- */

header{
    background:rgba(255,255,255,.8);
    backdrop-filter:blur(15px);
    position:sticky;
    top:0;
    z-index:50;
    padding:15px 20px;
    box-shadow:0 3px 20px #7c3a7c22;
}

.top{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    font-size:29px;
    font-weight:900;
}

.logo span{
    color:#ed4f9d;
}

.stats{
    display:flex;
    gap:9px;
    flex-wrap:wrap;
}

.stat{
    background:white;
    padding:9px 14px;
    border-radius:30px;
    font-weight:bold;
    box-shadow:0 4px 14px #00000012;
}

/* ---------- MAIN ---------- */

main{
    max-width:1200px;
    margin:auto;
    padding:22px;
}

.challenge{
    background:rgba(255,255,255,.88);
    border-radius:24px;
    padding:18px 22px;
    margin-bottom:20px;
    box-shadow:0 10px 30px #6e367b18;
}

.challengeFlex{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.challenge h2{
    margin:0 0 5px;
}

.challenge p{
    margin:0;
    color:#76566f;
}

.progressBox{
    min-width:220px;
}

.progress{
    height:12px;
    background:#eee;
    border-radius:20px;
    overflow:hidden;
    margin-top:7px;
}

.progress div{
    height:100%;
    width:20%;
    background:linear-gradient(90deg,#ff55a5,#9362ff);
    transition:.5s;
}

/* ---------- GAME ---------- */

.game{
    display:grid;
    grid-template-columns:470px 1fr;
    gap:20px;
}

.card{
    background:rgba(255,255,255,.88);
    border-radius:28px;
    padding:20px;
    box-shadow:0 12px 35px #5b286b1c;
}

/* ---------- DRESS ROOM ---------- */

.dressroom{
    position:relative;
    height:650px;
    overflow:hidden;
    background:
        linear-gradient(90deg,#f4d9e9 0 8%,transparent 8% 92%,#f4d9e9 92%),
        linear-gradient(#fff5fb,#e7d9ff);
    border-radius:23px;
    border:7px solid white;
}

.curtain{
    position:absolute;
    top:0;
    width:80px;
    height:100%;
    background:linear-gradient(90deg,#f09bc7,#ffcae5,#ef91c1);
    opacity:.8;
}

.curtain.left{left:0}
.curtain.right{right:0}

.mirror{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    top:25px;
    width:360px;
    height:575px;
    border-radius:180px 180px 30px 30px;
    background:
        radial-gradient(circle at 50% 20%,#fff9,transparent 20%),
        linear-gradient(150deg,#fff,#e9e2ff);
    border:10px solid #d8a9ce;
    box-shadow:inset 0 0 35px #8d5d8d22;
}

/* ---------- CHARACTER ---------- */

.character{
    position:absolute;
    width:260px;
    height:540px;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    transition:.35s;
}

.character.walk{
    animation:bounce .6s ease;
}

@keyframes bounce{
    0%,100%{transform:translateX(-50%) translateY(0)}
    50%{transform:translateX(-50%) translateY(-10px)}
}

.head{
    position:absolute;
    width:104px;
    height:119px;
    left:78px;
    top:28px;
    background:#efb08c;
    border-radius:50% 50% 47% 47%;
    z-index:7;
}

.neck{
    position:absolute;
    width:31px;
    height:40px;
    left:115px;
    top:135px;
    background:#efb08c;
    z-index:3;
}

.hairBack{
    position:absolute;
    width:139px;
    height:170px;
    left:60px;
    top:7px;
    border-radius:75px 75px 55px 55px;
    background:#593727;
    z-index:8;
}

.hairFront{
    position:absolute;
    width:125px;
    height:73px;
    left:68px;
    top:10px;
    border-radius:70px 70px 25px 25px;
    background:#593727;
    z-index:12;
}

.fringe{
    position:absolute;
    width:65px;
    height:55px;
    left:82px;
    top:34px;
    border-radius:0 0 45px 45px;
    background:#593727;
    z-index:13;
    transform:rotate(-10deg);
}

.eye{
    position:absolute;
    top:78px;
    width:15px;
    height:19px;
    background:#2c1930;
    border-radius:50%;
    z-index:15;
}

.eye:after{
    content:"";
    position:absolute;
    width:5px;
    height:5px;
    background:white;
    border-radius:50%;
    left:3px;
    top:3px;
}

.eye.one{left:101px}
.eye.two{left:144px}

.blush{
    position:absolute;
    top:101px;
    width:22px;
    height:10px;
    border-radius:50%;
    background:#ee718c66;
    z-index:14;
}

.blush.one{left:91px}
.blush.two{left:147px}

.mouth{
    position:absolute;
    top:108px;
    left:124px;
    font-size:18px;
    z-index:15;
}

.body{
    position:absolute;
    width:126px;
    height:155px;
    left:67px;
    top:160px;
    background:#f254a4;
    z-index:5;
    clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);
    transition:.3s;
}

.arm{
    position:absolute;
    width:28px;
    height:140px;
    background:#efb08c;
    border-radius:25px;
    top:167px;
    z-index:3;
}

.arm.one{
    left:45px;
    transform:rotate(8deg);
}

.arm.two{
    left:187px;
    transform:rotate(-8deg);
}

.hand{
    position:absolute;
    width:30px;
    height:30px;
    background:#efb08c;
    border-radius:50%;
    top:290px;
    z-index:4;
}

.hand.one{left:35px}
.hand.two{left:194px}

.legs{
    position:absolute;
    top:305px;
    left:91px;
    display:flex;
    gap:20px;
    z-index:2;
}

.leg{
    width:36px;
    height:145px;
    background:#efb08c;
    border-radius:0 0 25px 25px;
}

.shoe{
    position:absolute;
    top:438px;
    font-size:42px;
    z-index:10;
}

.shoe.one{left:76px}
.shoe.two{left:154px}

.acc{
    position:absolute;
    z-index:30;
    font-size:40px;
    left:108px;
    top:17px;
}

.bag{
    position:absolute;
    z-index:30;
    font-size:45px;
    left:202px;
    top:245px;
}

.makeup{
    position:absolute;
    z-index:20;
    top:92px;
    left:116px;
    font-size:18px;
}

/* ---------- MENU ---------- */

h3{
    margin:0 0 14px;
}

.tabs{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.tab{
    border:0;
    padding:10px 13px;
    border-radius:13px;
    cursor:pointer;
    background:#f4e8f2;
    color:#472640;
    font-weight:bold;
}

.tab.active{
    color:white;
    background:linear-gradient(90deg,#f451a0,#965cff);
}

.items{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    max-height:470px;
    overflow-y:auto;
    padding:3px;
}

.item{
    position:relative;
    border:2px solid transparent;
    background:white;
    border-radius:18px;
    padding:11px 5px;
    text-align:center;
    cursor:pointer;
    transition:.2s;
}

.item:hover{
    transform:translateY(-4px);
    box-shadow:0 8px 20px #6d2d7717;
}

.item.selected{
    border-color:#f451a0;
    box-shadow:0 0 0 3px #f451a01a;
}

.icon{
    font-size:35px;
    display:block;
    margin-bottom:5px;
}

.name{
    font-size:12px;
    font-weight:bold;
}

.price{
    font-size:11px;
    margin-top:4px;
    color:#9b6900;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:16px;
}

.btn{
    flex:1;
    padding:14px;
    border:0;
    border-radius:16px;
    cursor:pointer;
    font-size:16px;
    font-weight:900;
}

.primary{
    color:white;
    background:linear-gradient(90deg,#f451a0,#8e5cff);
}

.secondary{
    background:#f2e9f2;
    color:#472640;
}

/* ---------- RESULT ---------- */

.overlay{
    position:fixed;
    inset:0;
    background:#32142f99;
    backdrop-filter:blur(7px);
    display:none;
    place-items:center;
    z-index:100;
}

.overlay.show{
    display:grid;
}

.result{
    width:min(92%,470px);
    background:white;
    border-radius:30px;
    padding:32px;
    text-align:center;
    animation:pop .35s ease;
}

@keyframes pop{
    from{transform:scale(.7);opacity:0}
    to{transform:scale(1);opacity:1}
}

.bigScore{
    font-size:75px;
    font-weight:900;
    background:linear-gradient(90deg,#f451a0,#8e5cff);
    -webkit-background-clip:text;
    color:transparent;
}

.stars{
    font-size:28px;
    letter-spacing:4px;
}

.result button{
    border:0;
    padding:14px 24px;
    border-radius:15px;
    color:white;
    background:#f451a0;
    font-weight:bold;
    cursor:pointer;
}

/* ---------- TOAST ---------- */

.toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translate(-50%,100px);
    background:#3a2037;
    color:white;
    padding:13px 22px;
    border-radius:30px;
    opacity:0;
    transition:.3s;
    z-index:200;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* ---------- RESPONSIVE ---------- */

@media(max-width:900px){
    .game{
        grid-template-columns:1fr;
    }

    .dressroom{
        max-width:470px;
        margin:auto;
    }
}

@media(max-width:600px){
    main{padding:10px}

    .top,
    .challengeFlex{
        flex-direction:column;
        align-items:flex-start;
    }

    .progressBox{
        width:100%;
    }

    .dressroom{
        height:590px;
    }

    .mirror{
        transform:translateX(-50%) scale(.9);
        transform-origin:top center;
    }

    .items{
        grid-template-columns:repeat(2,1fr);
    }
}
</style>
</head>

<body>

<header>
<div class="top">

    <div class="logo">
        👗 <span>Fashion</span> Star ✨
    </div>

    <div class="stats">
        <div class="stat">💰 <span id="coins">500</span></div>
        <div class="stat">⭐ Nível <span id="level">1</span></div>
        <div class="stat">🏆 <span id="wins">0</span></div>
    </div>

</div>
</header>


<main>

<section class="challenge">

<div class="challengeFlex">

    <div>
        <h2 id="challengeTitle">🌟 Tapete Vermelho</h2>
        <p id="challengeText">
            Cria um look digno de uma estrela!
        </p>
    </div>

    <div class="progressBox">
        <strong>Desafios</strong>
        <div class="progress">
            <div id="progress"></div>
        </div>
    </div>

</div>

</section>


<section class="game">

<!-- PERSONAGEM -->

<div class="card">

<h3>✨ Provador</h3>

<div class="dressroom">

    <div class="curtain left"></div>
    <div class="curtain right"></div>

    <div class="mirror">

        <div class="character" id="character">

            <div class="hairBack" id="hairBack"></div>
            <div class="hairFront" id="hairFront"></div>
            <div class="fringe" id="fringe"></div>

            <div class="head"></div>

            <div class="eye one"></div>
            <div class="eye two"></div>

            <div class="blush one"></div>
            <div class="blush two"></div>

            <div class="mouth">⌣</div>

            <div class="makeup" id="makeup"></div>

            <div class="neck"></div>

            <div class="arm one"></div>
            <div class="arm two"></div>

            <div class="body" id="body"></div>

            <div class="hand one"></div>
            <div class="hand two"></div>

            <div class="legs">
                <div class="leg"></div>
                <div class="leg"></div>
            </div>

            <div class="shoe one" id="shoe1">👠</div>
            <div class="shoe two" id="shoe2">👠</div>

            <div class="acc" id="acc"></div>
            <div class="bag" id="bag"></div>

        </div>

    </div>

</div>

</div>


<!-- MENU -->

<div class="card">

<h3>🛍️ Guarda-Roupa</h3>

<div class="tabs" id="tabs"></div>

<div class="items" id="items"></div>

<div class="actions">

<button class="btn secondary" onclick="clearLook()">
🔄 Limpar
</button>

<button class="btn primary" onclick="judge()">
⭐ Avaliar
</button>

</div>

</div>

</section>

</main>


<!-- RESULTADO -->

<div class="overlay" id="overlay">

<div class="result">

    <h2 id="resultTitle">✨ Resultado!</h2>

    <div class="bigScore" id="score">95</div>

    <div class="stars" id="stars">⭐⭐⭐⭐⭐</div>

    <p id="resultText"></p>

    <p>
        💰 Ganhaste
        <strong>+<span id="reward">0</span></strong>
        moedas!
    </p>

    <button onclick="nextChallenge()">
        🎯 Próximo Desafio
    </button>

</div>

</div>


<div class="toast" id="toast"></div>


<script>

/* ================================
   DESAFIOS
================================ */

const challenges=[

{
title:"🌟 Tapete Vermelho",
text:"Cria um look digno de uma estrela!",
colors:["#171717","#8b5cf6","#f5c542"],
bonus:["dress","heels","diamond"]
},

{
title:"🏖️ Dia de Praia",
text:"Fresca, divertida e pronta para o verão!",
colors:["#38bdf8","#facc15","#ff72b6"],
bonus:["skirt","sneakers","sunglasses"]
},

{
title:"🎉 Festa",
text:"Cria um look que faça toda a gente olhar!",
colors:["#ff4fa3","#8b5cf6","#ef4444"],
bonus:["dress","heels","crown"]
},

{
title:"📚 Escola Fashion",
text:"Confortável, bonita e super fashion!",
colors:["#60a5fa","#f9a8d4","#34d399"],
bonus:["jacket","sneakers","bag"]
},

{
title:"💎 Gala de Luxo",
text:"Mostra o teu verdadeiro estilo!",
colors:["#171717","#6d28d9","#f5c542"],
bonus:["dress","heels","diamond"]
}

];


/* ================================
   ROUPAS
================================ */

const clothes=[

{id:"pink",name:"Vestido Rosa",icon:"👗",color:"#f451a0",type:"dress",price:0},

{id:"purple",name:"Vestido Roxo",icon:"💜",color:"#8b5cf6",type:"dress",price:80},

{id:"black",name:"Vestido Preto",icon:"🖤",color:"#171717",type:"dress",price:120},

{id:"red",name:"Vestido Vermelho",icon:"❤️",color:"#ef4444",type:"dress",price:150},

{id:"blue",name:"Vestido Azul",icon:"💙",color:"#38bdf8",type:"dress",price:100},

{id:"gold",name:"Vestido Dourado",icon:"✨",color:"#f5c542",type:"dress",price:200},

{id:"white",name:"Vestido Branco",icon:"🤍",color:"#f8fafc",type:"dress",price:180},

{id:"green",name:"Vestido Verde",icon:"💚",color:"#34d399",type:"dress",price:130},

{id:"skirt",name:"Saia Fashion",icon:"👚",color:"#c084fc",type:"skirt",price:70},

{id:"jacket",name:"Casaco Cool",icon:"🧥",color:"#60a5fa",type:"jacket",price:90}

];


/* ================================
   CABELOS
================================ */

const hairs=[

{id:"brown",name:"Castanho",icon:"🤎",color:"#593727",price:0},

{id:"black",name:"Preto",icon:"🖤",color:"#171717",price:40},

{id:"blonde",name:"Loiro",icon:"💛",color:"#e9bd50",price:80},

{id:"pink",name:"Rosa",icon:"💗",color:"#ec4899",price:120},

{id:"purple",name:"Roxo",icon:"💜",color:"#8b5cf6",price:150},

{id:"blue",name:"Azul",icon:"💙",color:"#38bdf8",price:180}

];


/* ================================
   SAPATOS
================================ */

const shoes=[

{id:"heels",name:"Salto",icon:"👠",value:"👠",price:0},

{id:"sneakers",name:"Ténis",icon:"👟",value:"👟",price:50},

{id:"boots",name:"Botas",icon:"🥾",value:"🥾",price:80},

{id:"flats",name:"Sapatilhas",icon:"🥿",value:"🥿",price:60}

];


/* ================================
   ACESSÓRIOS
================================ */

const accessories=[

{id:"none",name:"Nenhum",icon:"❌",value:"",price:0},

{id:"crown",name:"Coroa",icon:"👑",value:"👑",price:150},

{id:"diamond",name:"Diamante",icon:"💎",value:"💎",price:200},

{id:"sunglasses",name:"Óculos",icon:"🕶️",value:"🕶️",price:90},

{id:"heart",name:"Coração",icon:"💖",value:"💖",price:70},

{id:"star",name:"Estrela",icon:"⭐",value:"⭐",price:80}

];


/* ================================
   MALAS
================================ */

const bags=[

{id:"none",name:"Nenhuma",icon:"❌",value:"",price:0},

{id:"pinkbag",name:"Mala Rosa",icon:"👜",value:"👜",price:60},

{id:"purse",name:"Mala Luxo",icon:"👛",value:"👛",price:120},

{id:"backpack",name:"Mochila",icon:"🎒",value:"🎒",price:50}

];


/* ================================
   MAQUILHAGEM
================================ */

const makeupItems=[

{id:"none",name:"Natural",icon:"😊",value:"",price:0},

{id:"pink",name:"Gloss",icon:"💄",value:"💗",price:50},

{id:"sparkle",name:"Brilho",icon:"✨",value:"✨",price:80},

{id:"hearts",name:"Corações",icon:"💕",value:"💕",price:100}

];


/* ================================
   ESTADO
================================ */

let coins=Number(localStorage.getItem("coins"))||500;
let level=Number(localStorage.getItem("level"))||1;
let wins=Number(localStorage.getItem("wins"))||0;
let challengeIndex=Number(localStorage.getItem("challenge"))||0;

let owned=JSON.parse(
    localStorage.getItem("owned")||"{}"
);

let category="roupa";

let look={
    roupa:"pink",
    cabelo:"brown",
    sapatos:"heels",
    acessorios:"none",
    malas:"none",
    maquiagem:"none"
};


/* ================================
   CATEGORIAS
================================ */

const categories={
    roupa:["👗","Roupa",clothes],
    cabelo:["💇","Cabelo",hairs],
    sapatos:["👠","Sapatos",shoes],
    acessorios:["💎","Acessórios",accessories],
    malas:["👜","Malas",bags],
    maquiagem:["💄","Maquilhagem",makeupItems]
};


/* ================================
   ELEMENTOS
================================ */

const coinsEl=document.getElementById("coins");
const levelEl=document.getElementById("level");
const winsEl=document.getElementById("wins");

const tabs=document.getElementById("tabs");
const items=document.getElementById("items");

const body=document.getElementById("body");

const hairBack=document.getElementById("hairBack");
const hairFront=document.getElementById("hairFront");
const fringe=document.getElementById("fringe");

const shoe1=document.getElementById("shoe1");
const shoe2=document.getElementById("shoe2");

const acc=document.getElementById("acc");
const bag=document.getElementById("bag");
const makeup=document.getElementById("makeup");

const character=document.getElementById("character");

const overlay=document.getElementById("overlay");


/* ================================
   GUARDAR
================================ */

function save(){

    localStorage.setItem("coins",coins);
    localStorage.setItem("level",level);
    localStorage.setItem("wins",wins);
    localStorage.setItem("challenge",challengeIndex);
    localStorage.setItem("owned",JSON.stringify(owned));

}


/* ================================
   UI
================================ */

function updateStats(){

    coinsEl.textContent=coins;
    levelEl.textContent=level;
    winsEl.textContent=wins;

    save();
}


function updateChallenge(){

    let c=challenges[challengeIndex];

    document.getElementById("challengeTitle")
        .textContent=c.title;

    document.getElementById("challengeText")
        .textContent=c.text;

    document.getElementById("progress")
        .style.width=
        ((challengeIndex+1)/challenges.length*100)+"%";
}


/* ================================
   TABS
================================ */

function renderTabs(){

    tabs.innerHTML="";

    Object.keys(categories).forEach(key=>{

        let button=document.createElement("button");

        button.className=
            "tab "+(category===key?"active":"");

        button.textContent=
            categories[key][0]+" "+categories[key][1];

        button.onclick=()=>{

            category=key;

            renderTabs();
            renderItems();

        };

        tabs.appendChild(button);

    });

}


/* ================================
   ITENS
================================ */

function isOwned(id){

    return (
        id==="pink"||
        id==="brown"||
        id==="heels"||
        id==="none"||
        owned[id]
    );

}


function renderItems(){

    items.innerHTML="";

    categories[category][2].forEach(item=>{

        let div=document.createElement("div");

        let available=isOwned(item.id);

        let selected=
            look[category]===item.id;

        div.className=
            "item "+(selected?"selected":"");

        div.innerHTML=`

            <span class="icon">
                ${item.icon}
            </span>

            <span class="name">
                ${item.name}
            </span>

            <div class="price">
                ${
                    available
                    ?"✓ Disponível"
                    :"💰 "+item.price
                }
            </div>

        `;

        div.onclick=()=>selectItem(item);

        items.appendChild(div);

    });

}


/* ================================
   COMPRAR / ESCOLHER
================================ */

function selectItem(item){

    if(!isOwned(item.id)){

        if(coins<item.price){

            toastMessage(
                "💰 Não tens moedas suficientes!"
            );

            return;
        }

        coins-=item.price;

        owned[item.id]=true;

        toastMessage(
            "🛍️ Compraste "+item.name+"!"
        );

        updateStats();
    }

    look[category]=item.id;

    applyLook();

    renderItems();
}


/* ================================
   LOOK
================================ */

function find(list,id){

    return list.find(x=>x.id===id);
}


function applyLook(){

    /* ROUPA */

    let outfit=find(clothes,look.roupa);

    if(outfit){

        body.style.background=outfit.color;

        if(outfit.type==="jacket"){

            body.style.clipPath=
                "polygon(10% 0,90% 0,90% 100%,10% 100%)";

            body.style.borderRadius="15px";

        }else if(outfit.type==="skirt"){

            body.style.clipPath=
                "polygon(18% 0,82% 0,100% 100%,0 100%)";

            body.style.borderRadius="0";

        }else{

            body.style.clipPath=
                "polygon(18% 0,82% 0,100% 100%,0 100%)";

            body.style.borderRadius=
                "15px 15px 45px 45px";

        }

    }


    /* CABELO */

    let h=find(hairs,look.cabelo);

    if(h){

        hairBack.style.background=h.color;
        hairFront.style.background=h.color;
        fringe.style.background=h.color;

    }


    /* SAPATOS */

    let s=find(shoes,look.sapatos);

    if(s){

        shoe1.textContent=s.value;
        shoe2.textContent=s.value;

    }


    /* ACESSÓRIO */

    let a=find(accessories,look.acessorios);

    acc.textContent=a?a.value:"";


    /* MALA */

    let b=find(bags,look.malas);

    bag.textContent=b?b.value:"";


    /* MAQUILHAGEM */

    let m=find(makeupItems,look.maquiagem);

    makeup.textContent=m?m.value:"";

}


/* ================================
   AVALIAR
================================ */

function judge(){

    let c=challenges[challengeIndex];

    let score=55;

    let outfit=find(clothes,look.roupa);
    let shoe=find(shoes,look.sapatos);

    /* COR CERTA */

    if(
        outfit &&
        c.colors.includes(outfit.color)
    ){
        score+=15;
    }

    /* TIPO CERTO */

    if(
        outfit &&
        c.bonus.includes(outfit.type)
    ){
        score+=10;
    }

    /* SAPATOS */

    if(
        shoe &&
        c.bonus.includes(look.sapatos)
    ){
        score+=8;
    }

    /* ACESSÓRIO */

    if(
        c.bonus.includes(look.acessorios)
    ){
        score+=7;
    }

    /* MALA */

    if(
        c.bonus.includes("bag") &&
        look.malas!=="none"
    ){
        score+=5;
    }

    /* RANDOM */

    score+=Math.floor(Math.random()*8);

    score=Math.min(score,100);

    let reward=Math.floor(score*1.5);

    if(score>=90){
        reward+=50;
    }

    coins+=reward;

    if(score>=80){
        wins++;
    }

    level=
        Math.max(
            level,
            Math.floor(wins/2)+1
        );

    updateStats();

    showResult(score,reward);

}


/* ================================
   RESULTADO
================================ */

function showResult(score,reward){

    document.getElementById("score")
        .textContent=score;

    document.getElementById("reward")
        .textContent=reward;

    let stars;

    if(score>=95)
        stars="⭐⭐⭐⭐⭐";
    else if(score>=85)
        stars="⭐⭐⭐⭐";
    else if(score>=70)
        stars="⭐⭐⭐";
    else if(score>=55)
        stars="⭐⭐";
    else
        stars="⭐";

    document.getElementById("stars")
        .textContent=stars;

    let message;

    if(score>=95){

        message=
        "👑 PERFEITO! És uma verdadeira Fashion Star!";

    }else if(score>=85){

        message=
        "💖 UAU! O júri adorou o teu look!";

    }else if(score>=70){

        message=
        "✨ Muito bom! Estás a ficar profissional!";

    }else{

        message=
        "💡 Continua a experimentar combinações!";

    }

    document.getElementById("resultText")
        .textContent=message;

    overlay.classList.add("show");

    character.classList.add("walk");

    setTimeout(()=>{
        character.classList.remove("walk");
    },700);

}


/* ================================
   PRÓXIMO DESAFIO
================================ */

function nextChallenge(){

    overlay.classList.remove("show");

    challengeIndex++;

    if(
        challengeIndex>=challenges.length
    ){

        challengeIndex=0;

        toastMessage(
            "🏆 Completaste todos os desafios!"
        );

    }

    updateChallenge();
    save();

}


/* ================================
   LIMPAR
================================ */

function clearLook(){

    look={
        roupa:"pink",
        cabelo:"brown",
        sapatos:"heels",
        acessorios:"none",
        malas:"none",
        maquiagem:"none"
    };

    applyLook();
    renderItems();

    toastMessage("🔄 Look reiniciado!");

}


/* ================================
   TOAST
================================ */

let toastTimer;

function toastMessage(message){

    const t=document.getElementById("toast");

    t.textContent=message;

    t.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer=setTimeout(()=>{
        t.classList.remove("show");
    },2500);

}


/* ================================
   START
================================ */

updateStats();
updateChallenge();
renderTabs();
renderItems();
applyLook();

</script>
