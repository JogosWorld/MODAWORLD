.result.show {

.result-box {

}

.score {
    font-size: 70px;

}

.stars {

    font-weight: bold;

}

.toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: #3d2039;
    color: white;
    padding: 13px 20px;
    border-radius: 30px;
    opacity: 0;
    transition: .3s;
    z-index: 200;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

@keyframes pop {
    from {
        transform: scale(.7);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

@keyframes sparkle {
    0%,100% { transform: scale(1) rotate(0); }
    50% { transform: scale(1.05) rotate(2deg); }
}

.doll.celebrate {
    animation: sparkle .7s infinite;
}

@media(max-width: 850px) {
    .game {
        grid-template-columns: 1fr;

        min-height: 590px;
    }
}

@media(max-width: 500px) {
    header {
        position: static;
    }

    main {
        padding: 12px;
    }

        align-items: flex-start;

        transform-origin: top center;
        margin-bottom: -60px;
    }

    .items {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>

<script>

/* =========================
   DADOS DO JOGO
========================= */

const challenges = [

        title: "🌟 Tapete Vermelho",

        colors: ["#111827", "#8b5cf6", "#ff4fa3"],

    {

        colors: ["#60a5fa", "#f5b942", "#ff8fc8"],
        bonus: ["jacket", "sneakers", "bag"]
    },
    {
        title: "💎 Gala de Luxo",
        text: "Mostra que és uma verdadeira fashionista!",
        colors: ["#111827", "#6d28d9", "#f5b942"],
        bonus: ["dress", "heels", "diamond"]
    }
];


const items = {

    roupa: [
        {id:"pink", name:"Vestido Rosa", icon:"👗", color:"#ff5ca8", type:"dress", price:0},
        {id:"purple", name:"Vestido Roxo", icon:"👗", color:"#8b5cf6", type:"dress", price:80},
        {id:"black", name:"Vestido Preto", icon:"🖤", color:"#171717", type:"dress", price:120},
        {id:"blue", name:"Vestido Azul", icon:"💙", color:"#38bdf8", type:"dress", price:100},
        {id:"yellow", name:"Vestido Dourado", icon:"💛", color:"#facc15", type:"dress", price:180},
        {id:"red", name:"Vestido Vermelho", icon:"❤️", color:"#ef4444", type:"dress", price:150},
        {id:"white", name:"Vestido Branco", icon:"🤍", color:"#f8fafc", type:"dress", price:200},
        {id:"green", name:"Vestido Verde", icon:"💚", color:"#34d399", type:"dress", price:130},
        {id:"skirt", name:"Saia Fashion", icon:"👚", color:"#c084fc", type:"skirt", price:70},
        {id:"jacket", name:"Casaco Cool", icon:"🧥", color:"#60a5fa", type:"jacket", price:90}
    ],

    cabelo: [
        {id:"brown", name:"Castanho", icon:"🤎", color:"#5a3827", price:0},
        {id:"black", name:"Preto", icon:"🖤", color:"#171717", price:40},
        {id:"blonde", name:"Loiro", icon:"💛", color:"#e9bd50", price:80},
        {id:"pink", name:"Rosa", icon:"💗", color:"#ec4899", price:120},
        {id:"purple", name:"Roxo", icon:"💜", color:"#8b5cf6", price:150},
        {id:"blue", name:"Azul", icon:"💙", color:"#38bdf8", price:180}
    ],

    sapatos: [
        {id:"heels", name:"Salto", icon:"👠", value:"👠", price:0},
        {id:"sneakers", name:"Ténis", icon:"👟", value:"👟", price:50},
        {id:"boots", name:"Botas", icon:"🥾", value:"🥾", price:80},
        {id:"flats", name:"Sapatilhas", icon:"🥿", value:"🥿", price:60}
    ],

    acessorios: [
        {id:"crown", name:"Coroa", icon:"👑", value:"👑", price:150},
        {id:"diamond", name:"Diamante", icon:"💎", value:"💎", price:200},
        {id:"sunglasses", name:"Óculos", icon:"🕶️", value:"🕶️", price:90},
        {id:"earrings", name:"Brincos", icon:"💎", value:"💎", price:70},
        {id:"heart", name:"Coração", icon:"💖", value:"💖", price:60}
    ],

    malas: [
        {id:"bag", name:"Mala Rosa", icon:"👜", value:"👜", price:60},
        {id:"purse", name:"Mala Luxo", icon:"👛", value:"👛", price:120},
        {id:"backpack", name:"Mochila", icon:"🎒", value:"🎒", price:50}
    ],

    maquiagem: [
        {id:"none", name:"Natural", icon:"😊", value:"", price:0},
        {id:"pink", name:"Gloss Rosa", icon:"💄", value:"💗", price:50},
        {id:"sparkle", name:"Brilho", icon:"✨", value:"✨", price:80},
        {id:"heart", name:"Corações", icon:"💕", value:"💕", price:100}
    ]
};


/* =========================
   ESTADO
========================= */

let coins = Number(localStorage.getItem("fashionCoins")) || 500;
let level = Number(localStorage.getItem("fashionLevel")) || 1;
let wins = Number(localStorage.getItem("fashionWins")) || 0;

let challengeIndex =
    Number(localStorage.getItem("fashionChallenge")) || 0;

let currentTab = "roupa";

let look = {
    roupa: "pink",
    cabelo: "brown",
    sapatos: "heels",
    acessorios: null,
    malas: null,
    maquiagem: "none"
};

let owned = JSON.parse(
    localStorage.getItem("fashionOwned") || "{}"
);


/* =========================
   ELEMENTOS
========================= */

const coinsEl = document.getElementById("coins");
const levelEl = document.getElementById("level");
const winsEl = document.getElementById("wins");

const challengeTitle =
    document.getElementById("challengeTitle");

const challengeText =
    document.getElementById("challengeText");

const progress =
    document.getElementById("progress");

const tabs =
    document.getElementById("tabs");

const itemBox =
    document.getElementById("items");

const body =
    document.getElementById("body");

const hair =
    document.getElementById("hair");

const hairFront =
    document.getElementById("hairFront");

const shoes =
    document.getElementById("shoes");

const accessory =
    document.getElementById("accessory");

const bag =
    document.getElementById("bag");

const makeup =
    document.getElementById("makeup");

const doll =
    document.getElementById("doll");

const result =
    document.getElementById("result");

const toast =
    document.getElementById("toast");


/* =========================
   INICIALIZAÇÃO
========================= */

function init() {

    updateStats();
    updateChallenge();
    renderTabs();
    renderItems();
    applyLook();
}

function updateStats() {

    coinsEl.textContent = coins;
    levelEl.textContent = level;
    winsEl.textContent = wins;

    localStorage.setItem("fashionCoins", coins);
    localStorage.setItem("fashionLevel", level);
    localStorage.setItem("fashionWins", wins);
    localStorage.setItem("fashionChallenge", challengeIndex);
    localStorage.setItem(
        "fashionOwned",
        JSON.stringify(owned)
    );
}

function updateChallenge() {

    const c = challenges[challengeIndex];

    challengeTitle.textContent = c.title;
    challengeText.textContent = c.text;

    const percent =
        ((challengeIndex + 1) / challenges.length) * 100;

    progress.style.width = percent + "%";
}


/* =========================
   TABS
========================= */

const tabNames = {
    roupa: "👗 Roupa",
    cabelo: "💇 Cabelo",
    sapatos: "👠 Sapatos",
    acessorios: "💎 Acessórios",
    malas: "👜 Malas",
    maquiagem: "💄 Maquilhagem"
};

function renderTabs() {

    tabs.innerHTML = "";

    Object.keys(tabNames).forEach(key => {

        const button =
            document.createElement("button");

        button.className =
            "tab " +
            (currentTab === key ? "active" : "");

        button.textContent = tabNames[key];

        button.onclick = () => {

            currentTab = key;

            renderTabs();
            renderItems();
        };

        tabs.appendChild(button);
    });
}


/* =========================
   ITENS
========================= */

function itemOwned(id) {

    return owned[id] === true ||
           id === "pink" ||
           id === "brown" ||
           id === "heels" ||
           id === "none";
}

function renderItems() {

    itemBox.innerHTML = "";

    items[currentTab].forEach(item => {

        const div =
            document.createElement("div");

        const isOwned = itemOwned(item.id);

        const selected =
            look[currentTab] === item.id;

        div.className =
            "item " +
            (selected ? "selected " : "") +
            (!isOwned ? "locked" : "");

        div.innerHTML = `
            <span class="item-icon">${item.icon}</span>
            <span class="item-name">${item.name}</span>
            ${
                isOwned
                ? `<div class="price">✓ Disponível</div>`
                : `<div class="price">💰 ${item.price}</div>`
            }
        `;

        div.onclick = () => selectItem(item);

        itemBox.appendChild(div);
    });
}


function selectItem(item) {

    if (!itemOwned(item.id)) {

        if (coins < item.price) {

            showToast("💰 Não tens moedas suficientes!");

            return;
        }

        coins -= item.price;

        owned[item.id] = true;

        showToast(
            "🛍️ Compraste " + item.name + "!"
        );

        updateStats();
    }

    look[currentTab] = item.id;

    applyLook();
    renderItems();
}


/* =========================
   APLICAR LOOK
========================= */

function findItem(category, id) {

    return items[category].find(
        item => item.id === id
    );
}


function applyLook() {

    const roupa =
        findItem("roupa", look.roupa);

    if (roupa) {

        body.style.background =
            roupa.color;

        body.className =
            "body " + (roupa.type || "");
    }


    const cabelo =
        findItem("cabelo", look.cabelo);

    if (cabelo) {

        hair.style.background =
            cabelo.color;

        hairFront.style.background =
            cabelo.color;
    }


    const sapato =
        findItem("sapatos", look.sapatos);

    if (sapato) {

        shoes.innerHTML =
            `<span>${sapato.value}</span>
             <span>${sapato.value}</span>`;
    }


    const acc =
        findItem("acessorios", look.acessorios);

    accessory.textContent =
        acc ? acc.value : "";


    const mala =
        findItem("malas", look.malas);

    bag.textContent =
        mala ? mala.value : "";


    const makeupItem =
        findItem("maquiagem", look.maquiagem);

    makeup.textContent =
        makeupItem ? makeupItem.value : "";
}


/* =========================
   AVALIAÇÃO
========================= */

function judge() {

    const challenge =
        challenges[challengeIndex];

    let score = 55;

    const roupa =
        findItem("roupa", look.roupa);

    const sapato =
        findItem("sapatos", look.sapatos);

    const accessoryItem =
        findItem("acessorios", look.acessorios);

    /* Bónus por cores */

    if (
        roupa &&
        challenge.colors.includes(roupa.color)
    ) {
        score += 15;
    }

    /* Bónus por peças */

    if (
        roupa &&
        challenge.bonus.includes(roupa.type)
    ) {
        score += 10;
    }

    if (
        sapato &&
        challenge.bonus.includes(look.sapatos)
    ) {
        score += 8;
    }

    if (
        accessoryItem &&
        challenge.bonus.includes(look.acessorios)
    ) {
        score += 8;
    }

    /* Pequeno fator aleatório */

    score += Math.floor(Math.random() * 10);

    score = Math.min(score, 100);

    let reward =
        Math.floor(score * 1.5);

    if (score >= 90) {
        reward += 50;
    }

    coins += reward;

    if (score >= 80) {
        wins++;
    }

    level =
        Math.max(
            level,
            Math.floor(wins / 2) + 1
        );

    updateStats();

    showResult(score, reward);
}


/* =========================
   RESULTADO
========================= */

function showResult(score, reward) {

    document.getElementById("score")
        .textContent = score;

    document.getElementById("reward")
        .textContent = reward;

    let stars = "";

    if (score >= 95) {
        stars = "⭐⭐⭐⭐⭐";
    } else if (score >= 85) {
        stars = "⭐⭐⭐⭐";
    } else if (score >= 70) {
        stars = "⭐⭐⭐";
    } else if (score >= 55) {
        stars = "⭐⭐";
    } else {
        stars = "⭐";
    }

    document.getElementById("stars")
        .textContent = stars;

    let text = "";

    if (score >= 95) {
        text =
            "👑 PERFEITO! És uma verdadeira Fashion Star!";
    } else if (score >= 85) {
        text =
            "💖 Fantástico! O júri adorou o teu look!";
    } else if (score >= 70) {
        text =
            "✨ Muito bom! Continua a experimentar!";
    } else {
        text =
            "💡 Quase lá! Tenta combinar melhor as peças.";
    }

    document.getElementById("resultText")
        .textContent = text;

    result.classList.add("show");

    doll.classList.add("celebrate");
}


function nextChallenge() {

    result.classList.remove("show");

    doll.classList.remove("celebrate");

    challengeIndex++;

    if (
        challengeIndex >= challenges.length
    ) {
        challengeIndex = 0;

        showToast(
            "🏆 Completaste todos os desafios!"
        );
    }

    updateChallenge();
}


/* =========================
   LIMPAR LOOK
========================= */

function resetLook() {

    look = {
        roupa: "pink",
        cabelo: "brown",
        sapatos: "heels",
        acessorios: null,
        malas: null,
        maquiagem: "none"
    };

    applyLook();
    renderItems();

    showToast("🔄 Look limpo!");
}


/* =========================
   TOAST
========================= */

let toastTimer;

function showToast(message) {

    toast.textContent = message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {
            toast.classList.remove("show");
        }, 2500);
}


/* =========================
   COMEÇAR
========================= */

init();

</script>
