<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fashion Star 💖</title>

<style>
*{box-sizing:border-box}

:root{
  --pink:#ff4fa3;
  --purple:#8757ff;
  --dark:#3d2340;
  --soft:#fff7fc;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:var(--dark);
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 10%,#fff 0 5%,transparent 22%),
    radial-gradient(circle at 90% 20%,#fff 0 4%,transparent 20%),
    linear-gradient(135deg,#ffd8eb,#e9d7ff,#d6f2ff);
}

/* HEADER */

header{
  background:#ffffffdd;
  backdrop-filter:blur(15px);
  padding:15px 20px;
  position:sticky;
  top:0;
  z-index:100;
  box-shadow:0 5px 25px #5b245b18;
}

.header{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:28px;
  font-weight:900;
}

.logo span{
  color:var(--pink);
}

.stats{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.stat{
  background:white;
  padding:9px 14px;
  border-radius:30px;
  font-weight:bold;
  box-shadow:0 5px 15px #0001;
}

/* MAIN */

main{
  max-width:1200px;
  margin:auto;
  padding:22px;
}

.challenge{
  background:#ffffffdf;
  border-radius:25px;
  padding:18px 22px;
  margin-bottom:20px;
  box-shadow:0 10px 30px #55245518;
}

.challengeFlex{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.challenge h2{
  margin:0 0 5px;
}

.challenge p{
  margin:0;
  color:#80627c;
}

.progressBox{
  min-width:230px;
}

.progress{
  height:12px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
  margin-top:6px;
}

.progress div{
  height:100%;
  background:linear-gradient(90deg,var(--pink),var(--purple));
  transition:.5s;
}

/* GAME */

.game{
  display:grid;
  grid-template-columns:480px 1fr;
  gap:20px;
}

.card{
  background:#ffffffdf;
  border-radius:28px;
  padding:20px;
  box-shadow:0 12px 35px #5724571c;
}

/* STUDIO */

.studio{
  height:650px;
  position:relative;
  overflow:hidden;
  border-radius:23px;
  background:
    radial-gradient(circle at 50% 25%,#fff,transparent 30%),
    linear-gradient(180deg,#fff3fa,#e5d8ff);
  border:7px solid white;
}

.floor{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:90px;
  background:linear-gradient(#dac8e8,#c4acd5);
  transform:perspective(200px) rotateX(10deg);
  transform-origin:bottom;
}

.spot{
  position:absolute;
  width:300px;
  height:300px;
  border-radius:50%;
  left:50%;
  top:40px;
  transform:translateX(-50%);
  background:#fff8;
  filter:blur(20px);
}

/* CHARACTER */

.model{
  position:absolute;
  width:330px;
  height:570px;
  left:50%;
  bottom:18px;
  transform:translateX(-50%);
  transition:.3s;
}

.model.walk{
  animation:walk .65s ease;
}

@keyframes walk{
  0%,100%{transform:translateX(-50%)}
  25%{transform:translateX(-50%) rotate(-2deg)}
  75%{transform:translateX(-50%) rotate(2deg)}
}

svg{
  width:100%;
  height:100%;
  overflow:visible;
}

/* MENU */

.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}

.tab{
  border:0;
  padding:10px 13px;
  border-radius:14px;
  background:#f4e8f3;
  color:var(--dark);
  cursor:pointer;
  font-weight:bold;
}

.tab.active{
  color:white;
  background:linear-gradient(90deg,var(--pink),var(--purple));
}

.items{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  max-height:490px;
  overflow-y:auto;
  padding:3px;
}

.item{
  background:white;
  border:2px solid transparent;
  border-radius:18px;
  padding:11px 5px;
  text-align:center;
  cursor:pointer;
  transition:.2s;
}

.item:hover{
  transform:translateY(-4px);
  box-shadow:0 8px 20px #6d2d7717;
}

.item.selected{
  border-color:var(--pink);
  box-shadow:0 0 0 3px #ff4fa322;
}

.icon{
  display:block;
  font-size:34px;
  margin-bottom:5px;
}

.name{
  display:block;
  font-size:12px;
  font-weight:bold;
}

.price{
  font-size:11px;
  margin-top:4px;
  color:#9a6800;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:16px;
}

.btn{
  flex:1;
  border:0;
  padding:14px;
  border-radius:16px;
  cursor:pointer;
  font-size:16px;
  font-weight:900;
}

.primary{
  color:white;
  background:linear-gradient(90deg,var(--pink),var(--purple));
}

.secondary{
  background:#f0e8f1;
  color:var(--dark);
}

/* RESULTADO */

.overlay{
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  place-items:center;
  background:#32132f99;
  backdrop-filter:blur(8px);
}

.overlay.show{
  display:grid;
}

.result{
  width:min(92%,470px);
  background:white;
  border-radius:30px;
  padding:32px;
  text-align:center;
  animation:pop .35s ease;
}

@keyframes pop{
  from{transform:scale(.7);opacity:0}
  to{transform:scale(1);opacity:1}
}

.bigScore{
  font-size:75px;
  font-weight:900;
  background:linear-gradient(90deg,var(--pink),var(--purple));
  -webkit-background-clip:text;
  color:transparent;
}

.stars{
  font-size:29px;
  letter-spacing:4px;
}

.result button{
  border:0;
  background:var(--pink);
  color:white;
  padding:14px 25px;
  border-radius:15px;
  font-weight:bold;
  cursor:pointer;
}

/* TOAST */

.toast{
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translate(-50%,100px);
  background:#3c2139;
  color:white;
  padding:13px 22px;
  border-radius:30px;
  opacity:0;
  transition:.3s;
  z-index:500;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* MOBILE */

@media(max-width:900px){
  .game{
    grid-template-columns:1fr;
  }

  .studio{
    max-width:480px;
    margin:auto;
  }
}

@media(max-width:600px){
  main{
    padding:10px;
  }

  .header,
  .challengeFlex{
    flex-direction:column;
    align-items:flex-start;
  }

  .progressBox{
    width:100%;
  }

  .studio{
    height:590px;
  }

  .model{
    transform:translateX(-50%) scale(.9);
    transform-origin:bottom center;
  }

  .items{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>

/* =====================================

===================================== */

function save(){

 localStorage.setItem("coins",coins);
 localStorage.setItem("level",level);
 localStorage.setItem("wins",wins);
 localStorage.setItem("challenge",challengeIndex);
 localStorage.setItem("owned",JSON.stringify(owned));

}

function stats(){

 document.getElementById("coins").textContent=coins;
 document.getElementById("level").textContent=level;
 document.getElementById("wins").textContent=wins;

 save();

}

function updateChallenge(){

 const c=challenges[challengeIndex];

 document.getElementById("challengeTitle")

 document.getElementById("challengeText")
   .textContent=c.text;

 document.getElementById("progress")
   .style.width=
   ((challengeIndex+1)/challenges.length*100)+"%";

}


/* =====================================
   TABS
===================================== */

function renderTabs(){

 tabs.innerHTML="";

 Object.keys(categoryNames).forEach(key=>{

  const b=document.createElement("button");

  b.className=
   "tab "+(category===key?"active":"");

  b.textContent=categoryNames[key];

  b.onclick=()=>{

   category=key;

   renderTabs();
   renderItems();

  };

  tabs.appendChild(b);

 });

}


/* =====================================
   ITENS
===================================== */

function available(id){

 return (
  id==="pink"||
  id==="brown"||
  id==="heels"||
  id==="none"||
  owned[id]
 );

}


function renderItems(){

 items.innerHTML="";

 data[category].forEach(item=>{

  const div=document.createElement("div");

  div.className=
   "item "+
   (look[category]===item.id?"selected":"");

  div.innerHTML=`

   <span class="icon">${item.icon}</span>

   <span class="name">${item.name}</span>

   <div class="price">
    ${
      available(item.id)
      ? "✓ Disponível"
      : "💰 "+item.price
    }
   </div>

  `;

  div.onclick=()=>choose(item);

  items.appendChild(div);

 });

}


/* =====================================
   ESCOLHER / COMPRAR
===================================== */

function choose(item){

 if(!available(item.id)){

  if(coins<item.price){

   toast("💰 Não tens moedas suficientes!");

   return;
  }

  coins-=item.price;

  owned[item.id]=true;

  toast("🛍️ Compraste "+item.name+"!");

  stats();

 }

 look[category]=item.id;

 applyLook();
 renderItems();

}

/* =====================================
   AVALIAÇÃO
===================================== */

function judge(){

 const challenge=challenges[challengeIndex];

 const outfitItem=data.roupa.find(
  x=>x.id===look.roupa
 );

 let score=55;

 if(
  outfitItem &&
  challenge.colors.includes(outfitItem.color)
 ){
  score+=15;
 }

 if(
  outfitItem &&
  challenge.bonus.includes(outfitItem.style)
 ){
  score+=12;
 }

 if(
  challenge.bonus.includes(look.sapatos)
 ){
  score+=8;
 }

 if(
  challenge.bonus.includes(look.acessorios)
 ){
  score+=8;
 }

 if(
  challenge.bonus.includes("bag") &&
  look.malas!=="none"
 ){
  score+=4;
 }

 score+=Math.floor(Math.random()*7);

 score=Math.min(score,100);

 let reward=Math.floor(score*1.5);

 if(score>=90){
  reward+=50;
 }

 coins+=reward;

 if(score>=80){
  wins++;
 }

 level=Math.max(
  level,
  Math.floor(wins/2)+1
 );

 stats();

 showResult(score,reward);

}


/* =====================================
   RESULTADO
===================================== */

function showResult(score,reward){

 document.getElementById("score")
  .textContent=score;

 document.getElementById("reward")
  .textContent=reward;

 let stars;

 if(score>=95)
  stars="⭐⭐⭐⭐⭐";
 else if(score>=85)
  stars="⭐⭐⭐⭐";
 else if(score>=70)
  stars="⭐⭐⭐";
 else if(score>=55)
  stars="⭐⭐";
 else
  stars="⭐";

 document.getElementById("stars")
  .textContent=stars;

 let message;

 if(score>=95)
  message="👑 PERFEITO! És uma verdadeira Fashion Star!";
 else if(score>=85)
  message="💖 UAU! O júri adorou o teu look!";
 else if(score>=70)
  message="✨ Muito bom! Estás a ficar profissional!";
 else
  message="💡 Experimenta outras combinações!";

 document.getElementById("resultText")
  .textContent=message;

 document.getElementById("overlay")
  .classList.add("show");

 document.getElementById("model")
  .classList.add("walk");

 setTimeout(()=>{
  document.getElementById("model")
   .classList.remove("walk");
 },700);

}

function nextChallenge(){

 document.getElementById("overlay")
  .classList.remove("show");

 challengeIndex++;

 if(challengeIndex>=challenges.length){

  challengeIndex=0;

  toast("🏆 Completaste todos os desafios!");

 }

 updateChallenge();
 save();

}

/* =====================================

===================================== */

let toastTimer;

function toast(message){

 const t=document.getElementById("toast");

 t.textContent=message;

 t.classList.add("show");

 clearTimeout(toastTimer);

 toastTimer=setTimeout(()=>{
  t.classList.remove("show");
 },2500);

}
